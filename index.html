<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodWisdom – Food facts for everyday health</title>
<meta name="description" content="Simple, readable facts about seafood, milk, fruits, vegetables, staying fit and gaining weight healthily.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--red:#d62027;--black:#000;--white:#fff;--ink:#1d1d1d;--muted:#5b5b5b;--line:#e4e4e4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;font-family:"Noto Sans Devanagari","Noto Naskh Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--white);line-height:1.7}
header{background:var(--red);color:var(--white);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 20px}
header h1{margin:0;font-size:1.5rem;letter-spacing:.2px}
header p{margin:0;font-size:.9rem;opacity:.92}
.lang{display:flex;gap:6px}
.lang button{font:inherit;font-size:.9rem;color:var(--white);background:transparent;border:1.5px solid var(--white);border-radius:6px;padding:4px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--white);color:var(--red);font-weight:700}
.wrap{flex:1;display:flex;min-height:0}
nav{width:230px;flex-shrink:0;background:var(--black);display:flex;flex-direction:column}
nav button{font:inherit;text-align:start;color:var(--white);background:transparent;border:0;border-bottom:1px solid #3a3a5c;border-inline-start:5px solid transparent;padding:14px 14px;cursor:pointer;font-size:1.02rem;display:flex;align-items:center;gap:12px}
nav img{width:52px;height:52px;border-radius:6px;object-fit:cover;flex-shrink:0}
nav button:hover{background:#161616}
nav button[aria-current="true"]{background:#1f1f1f;border-inline-start-color:var(--red);font-weight:700}
main{flex:1;overflow:auto;padding:32px clamp(20px,5vw,56px)}
.grid{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 24px}
.card{font:inherit;width:120px;background:var(--white);border:2px solid var(--line);border-radius:10px;padding:0;cursor:pointer;overflow:hidden;text-align:center;color:var(--ink)}
.card[aria-pressed="true"]{border-color:var(--red)}
.cpic{position:relative;display:grid;place-items:center;height:92px;background:#f3f3f3;font-size:2.2rem}
.cpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .n{display:block;padding:6px 4px;font-size:.95rem}
.detail{display:flex;gap:22px;align-items:flex-start;max-width:70ch}
.detail img{width:220px;height:220px;object-fit:cover;border-radius:10px;flex-shrink:0}
.detail h3{margin:0 0 4px;font-size:1.3rem}
.detail p{margin:0;color:var(--muted)}
main h2{margin:0 0 6px;font-size:1.7rem}
.item{max-width:62ch;padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}
.pic{position:relative;flex:0 0 112px;height:112px;border-radius:8px;background:#f3f3f3;display:grid;place-items:center;font-size:2.6rem;overflow:hidden}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item h3{margin:0;font-size:1.1rem}
.item p{margin:2px 0 0;color:var(--muted)}
.note{max-width:62ch;margin-top:28px;font-size:.88rem;color:var(--muted)}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
@media(max-width:700px){
 .detail{flex-direction:column}
 .detail img{width:100%;height:auto;max-height:240px}
 .wrap{flex-direction:column}
 nav{width:100%;flex-direction:row;overflow-x:auto}
 nav button{white-space:nowrap;padding:10px 14px;border-bottom:0;border-inline-start:0;border-bottom:4px solid transparent}
 nav button[aria-current="true"]{border-inline-start-color:transparent;border-bottom-color:var(--red)}
}
</style>
</head>

en:{name:"English",dir:"ltr",tag:"Food facts for everyday health",
note:"General information only, not medical advice. Talk to a doctor or dietitian about your own health needs.",
s:[
["Seafood",[["Salmon","A fatty fish rich in omega-3 fats, the kind linked to a healthy heart and steady blood pressure. A single serving also carries a good dose of protein for muscle repair and vitamin D, a nutrient many people run low on, especially with little sun exposure. Grilling or baking keeps more of the omega-3 intact than deep frying."],["Sardines","Small and often eaten whole, bones included, which makes them one of the few foods that deliver calcium and omega-3 fats together in one bite. They are also an inexpensive source of protein and vitamin B12, a nutrient needed for nerve function and making red blood cells."],["Shrimp","A lean, low-calorie protein that fits well into most diets. It carries iodine, which the thyroid gland needs to work properly, and selenium, which supports the immune system. Shrimp also has a small amount of astaxanthin, the pigment that gives it a pink-red colour when cooked."]]],
["Milk",[["Milk","An everyday source of calcium for bones and teeth, paired with protein and vitamin B12. Many brands also add vitamin D, which helps the body absorb that calcium. A glass with breakfast is an easy way to cover a good share of a day\u2019s calcium needs."],["Yogurt","Made by fermenting milk, which gives it live bacterial cultures that can support digestion and gut health. It carries the same calcium and protein as milk, often in a more concentrated form, and the fermentation makes it easier to digest for some people who are sensitive to plain milk."],["Cheese","Concentrated milk, so it carries calcium and protein in a small serving, along with vitamin B12. It also tends to be higher in salt and saturated fat than milk or yogurt, so a thumb-sized portion is usually enough rather than a large slice."]]],
["Fruits",[["Banana","A convenient source of quick energy from natural sugars, along with potassium, a mineral that helps muscles and the heart work properly and balances out sodium in the diet. The riper the banana, the sweeter and easier to digest it becomes."],["Orange","Known for vitamin C, which supports the immune system and helps the body absorb iron from plant foods eaten in the same meal. It also has fibre in the pulp, which is part of why eating the fruit whole is better than drinking only the juice."],["Apple","Carries fibre, mostly in the skin, along with plant compounds that act as antioxidants. It travels well and keeps for days, which makes it one of the easiest fruits to keep on hand as a snack."],["Papaya","Contains an enzyme called papain that can help break down protein, along with vitamin C and vitamin A. A soft, ripe papaya is gentler on digestion than most other fruits."],["Guava","Carries more vitamin C by weight than an orange, along with fibre from its edible seeds. It is common and inexpensive in South Asia, making it an easy everyday fruit."],["Pomegranate","Known for antioxidant plant compounds called polyphenols, along with vitamin C and fibre in the seeds. The seeds can be eaten on their own or added over salads and yogurt."],["Watermelon","Mostly water, which makes it useful for staying hydrated in hot weather, along with vitamin A and a plant compound called lycopene that gives it its red colour."],["Grapes","A quick-energy fruit with plant compounds called polyphenols, concentrated mostly in the skin and seeds of darker varieties. Easy to carry and eat without preparation."],["Mango","Rich in vitamin A and vitamin C, which support eye health and the immune system. Being naturally sweet and calorie-dense, it is also a popular fruit for those looking to gain weight."],["Pineapple","Contains bromelain, an enzyme that may help the body break down protein, along with vitamin C and manganese. Vitamin C supports the immune system, while manganese plays a role in bone health and in turning food into energy. It is quite acidic, so large amounts can irritate the mouth or stomach of some people."],["Strawberry","Low in calories yet rich in vitamin C and anthocyanins, the plant compounds that give it its red colour and act as antioxidants. It also carries fibre and folate. Wash strawberries just before eating rather than before storing, so they do not spoil quickly."],["Kiwi","Carries more vitamin C by weight than an orange, along with fibre and vitamin K. Some studies link eating kiwi with more regular digestion in certain people. It can be eaten with the skin after washing, which adds extra fibre, or scooped out with a spoon."],["Pear","Provides fibre, much of it in the skin, along with vitamin C and potassium. Juicy and gentle, it is a good choice when you want a light, sweet snack. Pears keep ripening after they are picked, so firm ones can be left at room temperature for a few days."],["Dates","A concentrated source of natural sugars for quick energy, along with fibre, potassium and magnesium. They are calorie-dense, so a few go a long way; they are a popular way to break a fast and a handy choice for those looking to gain weight. Eating them with nuts or milk makes a more balanced snack."],["Fig","Provides fibre, calcium and potassium. Figs are eaten fresh or dried; dried figs have more concentrated sugar and calories, so portion size matters. The fibre may help keep digestion regular, and soaking dried figs overnight makes them softer and easier to eat."],["Lemon","Provides vitamin C and citric acid, and adds flavour to water, salads and cooking. Squeezing lemon over iron-rich foods like spinach or lentils may help the body absorb plant iron better. It is acidic, so rinsing the mouth with plain water after lemon drinks helps protect tooth enamel."],["Muskmelon","Mostly water, with vitamin A, vitamin C and potassium, which makes it hydrating in summer. It is low in calories for how sweet it tastes. Wash the rind well before cutting, because the knife can carry germs from the outside into the flesh."],["Coconut","Coconut water provides water and potassium, a natural option for replacing fluids; the white flesh has fibre and fat, much of it saturated, so it is best in moderate amounts. Coconut water is best drunk the same day it is opened."],["Jamun","A seasonal monsoon fruit in South Asia, its deep purple colour comes from anthocyanins, and it also carries vitamin C and a little iron. It is more tangy and slightly astringent than sweet, so it is often eaten with a pinch of salt. Eat it fresh and ripe; it can stain the tongue and clothes purple."],["Lychee","Provides vitamin C and polyphenols, along with plenty of water, in a sweet, juicy summer fruit. It has natural sugars, so a handful is enough. Peel it and remove the seed, which should not be eaten, and have ripe lychees in moderation with a meal rather than in large amounts on an empty stomach."],["Chikoo (Sapodilla)","A very sweet fruit that gives energy from natural sugars, along with fibre, potassium and vitamin C. A ripe, soft chikoo is sweet, while an unripe one tastes sticky and astringent. Being calorie-dense, it suits those looking to gain weight."]]],
["Vegetables",[["Spinach","A leafy green carrying iron for healthy blood, folate which is important for cell growth, and vitamin K which plays a role in blood clotting and bone health. Cooking it lightly reduces its bulk, so a cooked portion packs in more nutrients than the same volume of raw leaves."],["Broccoli","A vegetable rich in fibre, which helps digestion, along with vitamin C and plant compounds that act as antioxidants. Steaming instead of boiling keeps more of these nutrients in the vegetable rather than losing them into the cooking water."],["Carrot","Known for beta-carotene, which the body converts into vitamin A, important for eye health. Cooking carrots lightly, with a little oil, can help the body absorb more of this nutrient than eating them raw."],["Tomato","Carries lycopene, a plant compound linked with antioxidant activity, along with vitamin C. Cooking tomatoes, such as into a sauce, actually increases the amount of lycopene the body can absorb."],["Cucumber","Mostly water, which makes it a light, low-calorie addition to meals, along with a small amount of vitamin K. Keeping it chilled makes it a refreshing choice in hot weather."],["Bitter gourd","A vegetable traditional in South Asian cooking, carrying fibre and vitamin C. Its bitterness can be softened by salting and rinsing the slices before cooking."],["Cauliflower","A lighter alternative to grain-based sides, carrying fibre and vitamin C. It takes on the flavour of whatever spices it is cooked with, which is part of why it is so widely used."],["Onion","Used as a base in most savoury cooking, carrying plant compounds that act as antioxidants. Cooking it slowly over low heat brings out a natural sweetness without needing added sugar."],["Garlic","Used in small amounts for flavour, carrying a compound called allicin that forms when garlic is crushed or chopped. Letting chopped garlic rest for a few minutes before cooking allows more of this compound to form."],["Potato","Provides carbohydrates for energy, along with potassium, vitamin C, and fibre when the skin is eaten. Boiling or baking is lighter than deep frying. Boiled potatoes that have cooled contain resistant starch, a type of carbohydrate that acts a little like fibre."],["Sweet potato","Its orange colour comes from beta-carotene, and it also provides fibre, vitamin C and potassium. Boil or roast it rather than frying. The deeper the orange, the more beta-carotene it tends to carry."],["Cabbage","Provides vitamin C and vitamin K, along with fibre, and is low in calories. Eating it raw in salads keeps more vitamin C, while light cooking makes it easier to digest. Vegetables in the cabbage family can cause gas in some people."],["Peas","Give a good amount of protein for a vegetable, along with fibre, vitamin K, folate and vitamin C. Frozen peas are frozen soon after picking, so they keep their nutrients well. They fit easily into rice dishes, curries and soups."],["Okra","Provides fibre, vitamin C, vitamin K and folate. Its slippery part is soluble fibre. Cooking it with something sour like lemon or tomato, or over high heat, reduces the sliminess. Choose small, tender pods."],["Pumpkin","Provides beta-carotene, vitamin C, potassium and fibre, and is low in calories. Its seeds are edible too, carrying protein, magnesium and zinc. It is soft and easy to digest, which suits soups and curries."],["Beetroot","Provides folate, potassium and betalains, the plant compounds that give it its red colour; its natural nitrates have been linked in studies with support for healthy blood pressure. It can turn urine or stool pink or red, which is harmless. Boil or roast it with the skin on."],["Radish","Low in calories, with vitamin C and fibre, plus a peppery crunch. It is eaten raw in salads or stuffed into parathas. The leaves are edible too, carrying vitamin C and calcium, and can be cooked like other greens."],["Bottle gourd","Mostly water, very low in calories, with some fibre, and light on digestion, which is why it is common in everyday home cooking. Its mild taste picks up the flavour of the spices it is cooked with. If a bottle gourd tastes bitter, throw it away rather than eating it."],["Capsicum","Provides vitamin C, with red capsicum carrying even more than green, along with vitamin A and antioxidants. Eat it raw in salads or cooked quickly. Its colour shows how ripe it is."],["Brinjal (Eggplant)","Provides fibre, potassium and nasunin in its purple skin, a compound that acts as an antioxidant. It soaks up a lot of oil when fried, while roasting or grilling keeps it lighter."],["Fenugreek leaves (Methi)","Provide iron, vitamin K, vitamin C and fibre. They taste slightly bitter and are used in parathas and curries. Dried kasuri methi is mostly added for flavour. Cooking the leaves with potato or yogurt helps balance the bitterness."]]],
["Stay fit",[["Protein","Foods like eggs, lentils and fish take longer to digest than refined carbohydrates, which helps meals feel more filling for longer. Spreading protein across breakfast, lunch and dinner, rather than eating most of it at one meal, tends to help with steady energy through the day."],["Fibre","Found in vegetables, fruits and whole grains, fibre slows down digestion, which keeps hunger steadier between meals and supports regular digestion. Increasing fibre gradually, along with drinking enough water, helps avoid the bloating that can come from adding too much too quickly."],["Walking","A simple, low-impact exercise that most people can start without any equipment. About 30 minutes on most days of the week supports heart health, helps manage weight and can improve mood. It can be split into two or three shorter walks across the day if a single long walk is not practical."]]],
["Gain weight",[["Nuts","Calorie-dense food packed into a small volume, which makes a handful between meals an easy way to add extra calories without needing to eat a large amount of food. They also carry healthy fats and protein, so the added calories come with useful nutrition rather than empty sugar."],["Full-cream milk","Keeps all of the natural fat that is removed from low-fat or skimmed milk, making it a more calorie-dense option for anyone trying to gain weight. Drinking a glass alongside meals, or blending it into a shake with banana or nuts, is an easy way to add calories and protein without a large change in diet."],["Strength training","Exercise against resistance, such as weights or bodyweight moves, signals the body to use extra calories for building muscle rather than storing all of it as fat. Pairing it with enough protein in the diet makes it more effective, and starting with two or three sessions a week is enough to see the benefit."]]]]},
hi:{name:"हिन्दी",dir:"ltr",tag:"रोज़ की सेहत के लिए खाने की जानकारी",
note:"सिर्फ़ आम जानकारी है, मेडिकल सलाह नहीं। अपनी सेहत के बारे में डॉक्टर या डायटीशियन से बात करें।",
s:[
["सीफ़ूड",[["सामन","ओमेगा-3 वसा से भरपूर मछली, जिसे दिल की सेहत और ब्लड प्रेशर संतुलित रखने से जोड़ा जाता है। एक बार की खुराक में मांसपेशियों की मरम्मत के लिए अच्छा प्रोटीन और विटामिन D भी मिलता है, जो कम धूप में रहने वाले कई लोगों में कम पाया जाता है। तलने की बजाय ग्रिल या बेक करके खाने से ओमेगा-3 ज़्यादा बचा रहता है।"],["सार्डिन","छोटी मछली है और अक्सर हड्डियों समेत खाई जाती है, इसलिए एक ही निवाले में कैल्शियम और ओमेगा-3 दोनों मिल जाते हैं। ये प्रोटीन और विटामिन B12 का सस्ता स्रोत भी है, और B12 नसों के काम और लाल रक्त कोशिकाएँ बनाने के लिए ज़रूरी है।"],["झींगा","कम कैलोरी वाला पतला प्रोटीन, जो ज़्यादातर खानों में आसानी से फ़िट हो जाता है। इसमें आयोडीन होता है जो थायरॉइड ग्रंथि के सही काम के लिए चाहिए, और सेलेनियम जो रोग-प्रतिरोधक क्षमता को सहारा देता है।"]]],
["दूध",[["दूध","हड्डियों और दाँतों के लिए कैल्शियम का रोज़ का आसान स्रोत, साथ में प्रोटीन और विटामिन B12। कई ब्रांड इसमें विटामिन D भी मिलाते हैं, जो कैल्शियम सोखने में मदद करता है। नाश्ते के साथ एक गिलास दिन की कैल्शियम की ज़रूरत का अच्छा हिस्सा पूरा कर देता है।"],["दही","दूध को जमाकर बनता है, इसलिए इसमें ज़िंदा अच्छे बैक्टीरिया होते हैं जो पाचन और पेट की सेहत में मदद कर सकते हैं। इसमें दूध जितना ही कैल्शियम और प्रोटीन होता है, और जमने की वजह से कुछ लोगों के लिए सादे दूध से पचाना आसान होता है।"],["चीज़","चीज़ गाढ़ा किया हुआ दूध है, इसलिए छोटी मात्रा में ही कैल्शियम, प्रोटीन और विटामिन B12 मिल जाते हैं। साथ ही इसमें दूध या दही से ज़्यादा नमक और सैचुरेटेड फ़ैट होता है, इसलिए अंगूठे जितना टुकड़ा काफ़ी है, बड़ी स्लाइस नहीं।"]]],
["फल",[["केला","प्राकृतिक शक्कर से तुरंत ऊर्जा देने वाला आसान फल, साथ में पोटैशियम, जो मांसपेशियों और दिल के सही काम में मदद करता है और खाने में सोडियम का असर संतुलित रखता है। जितना पका केला, उतना मीठा और पचाने में आसान।"],["संतरा","विटामिन C के लिए जाना जाता है, जो रोग-प्रतिरोधक क्षमता को सहारा देता है और उसी खाने में खाए पौधों वाले आयरन को सोखने में मदद करता है। गूदे में फ़ाइबर भी होता है, इसीलिए सिर्फ़ जूस की बजाय पूरा फल खाना बेहतर है।"],["सेब","ज़्यादातर छिलके में मौजूद फ़ाइबर देता है, साथ में पौधों के वो तत्व जो एंटीऑक्सीडेंट का काम करते हैं। ये आसानी से साथ ले जाया जा सकता है और कई दिन ख़राब नहीं होता, इसलिए नाश्ते के लिए रखना आसान फल है।"],["पपीता","इसमें पपेन नाम का एंजाइम होता है जो प्रोटीन पचाने में मदद कर सकता है, साथ में विटामिन C और विटामिन A। नरम, पका हुआ पपीता ज़्यादातर फलों की तुलना में पाचन के लिए हल्का होता है।"],["अमरूद","वज़न के हिसाब से संतरे से भी ज़्यादा विटामिन C देता है, साथ में इसके खाने लायक़ बीजों से फ़ाइबर। दक्षिण एशिया में आम और सस्ता है, इसलिए रोज़ खाने के लिए आसान फल है।"],["अनार","पॉलीफ़िनॉल नाम के एंटीऑक्सीडेंट पौधों के तत्वों के लिए जाना जाता है, साथ में विटामिन C और बीजों में फ़ाइबर। दाने ऐसे ही खाए जा सकते हैं या सलाद और दही के ऊपर डाले जा सकते हैं।"],["तरबूज़","ज़्यादातर पानी होता है, इसलिए गर्मी में शरीर में पानी की कमी न होने देने में काम आता है, साथ में विटामिन A और लाइकोपीन नाम का पौधों का तत्व जो इसे लाल रंग देता है।"],["अंगूर","पॉलीफ़िनॉल नाम के पौधों के तत्वों वाला तुरंत ऊर्जा देने वाला फल, जो गहरे रंग की किस्मों के छिलके और बीजों में ज़्यादा होते हैं। आसानी से साथ ले जाया और बिना तैयारी के खाया जा सकता है।"],["आम","विटामिन A और विटामिन C से भरपूर, जो आँखों की सेहत और रोग-प्रतिरोधक क्षमता में मदद करते हैं। स्वाभाविक रूप से मीठा और ज़्यादा कैलोरी वाला होने से वज़न बढ़ाने वालों के लिए भी पसंदीदा फल है।"],["अनानास","इसमें ब्रोमेलेन नाम का एंजाइम होता है जो प्रोटीन पचाने में मदद कर सकता है, साथ में विटामिन C और मैंगनीज़। विटामिन C रोग-प्रतिरोधक क्षमता को सहारा देता है और मैंगनीज़ हड्डियों और ऊर्जा बनने की प्रक्रिया में काम आता है। ये काफ़ी खट्टा होता है, इसलिए ज़्यादा मात्रा में खाने पर कुछ लोगों के मुँह या पेट में जलन हो सकती है।"],["स्ट्रॉबेरी","कैलोरी कम होती है, फिर भी विटामिन C और एंथोसायनिन नाम के पौधों के तत्व देती है जो इसे लाल रंग देते हैं और एंटीऑक्सीडेंट का काम करते हैं। इसमें फ़ाइबर और फ़ोलेट भी होता है। जल्दी ख़राब न हों, इसलिए इन्हें खाने से ठीक पहले धोएँ, रखने से पहले नहीं।"],["कीवी","वज़न के हिसाब से संतरे से ज़्यादा विटामिन C देती है, साथ में फ़ाइबर और विटामिन K। कुछ अध्ययनों में इसे कुछ लोगों के लिए पाचन नियमित रखने से जोड़ा गया है। धोकर छिलके समेत खा सकते हैं, जिससे फ़ाइबर और मिलता है, या चम्मच से गूदा निकालकर खाएँ।"],["नाशपाती","छिलके में मौजूद फ़ाइबर के साथ विटामिन C और पोटैशियम देती है। रसीली और हल्की होती है, इसलिए हल्का मीठा नाश्ता चाहिए तो अच्छा विकल्प है। तोड़ने के बाद भी पकती है, इसलिए सख़्त नाशपाती को कुछ दिन कमरे के तापमान पर रखा जा सकता है।"],["खजूर","प्राकृतिक शक्कर का गाढ़ा स्रोत जो तुरंत ऊर्जा देता है, साथ में फ़ाइबर, पोटैशियम और मैग्नीशियम। इसमें कैलोरी ज़्यादा होती है, इसलिए कुछ दाने ही काफ़ी हैं; रोज़ा खोलने के लिए और वज़न बढ़ाने वालों के लिए भी पसंदीदा है। मेवों या दूध के साथ खाने से ये ज़्यादा संतुलित नाश्ता बन जाता है।"],["अंजीर","फ़ाइबर, कैल्शियम और पोटैशियम देता है। ताज़ा और सूखा दोनों तरह खाया जाता है; सूखे अंजीर में शक्कर और कैलोरी ज़्यादा गाढ़ी होती है, इसलिए मात्रा का ध्यान रखें। फ़ाइबर पाचन नियमित रखने में मदद कर सकता है, और रात भर भिगोने से सूखे अंजीर नरम और खाने में आसान हो जाते हैं।"],["नींबू","विटामिन C और साइट्रिक एसिड देता है, और पानी, सलाद और खाने में स्वाद लाता है। पालक या दाल जैसे आयरन वाले खाने पर निचोड़ने से शरीर को पौधों वाला आयरन बेहतर सोखने में मदद मिल सकती है। ये खट्टा होता है, इसलिए नींबू का पानी पीने के बाद सादे पानी से कुल्ला करना दाँतों की परत बचाने में मदद करता है।"],["खरबूज़ा","ज़्यादातर पानी होता है, साथ में विटामिन A, विटामिन C और पोटैशियम, इसलिए गर्मी में शरीर को नमी देता है। मिठास के हिसाब से कैलोरी कम होती है। काटने से पहले छिलका अच्छी तरह धोएँ, क्योंकि चाकू बाहर के कीटाणु अंदर तक ले जा सकता है।"],["नारियल","नारियल पानी में पानी और पोटैशियम होता है, जो शरीर में पानी की कमी पूरी करने का एक प्राकृतिक विकल्प है; सफ़ेद गिरी में फ़ाइबर और वसा होती है, जिसमें ज़्यादातर सैचुरेटेड है, इसलिए सीमित मात्रा में खाएँ। नारियल पानी खुलने के बाद उसी दिन पी लेना बेहतर है।"],["जामुन","दक्षिण एशिया में बरसात का मौसमी फल, जिसका गहरा बैंगनी रंग एंथोसायनिन से आता है, साथ में विटामिन C और थोड़ा आयरन। ये बहुत मीठा नहीं, थोड़ा कसैला-खट्टा होता है, इसलिए अक्सर चुटकी भर नमक के साथ खाया जाता है। ताज़ा और पका हुआ खाएँ; ये ज़बान और कपड़ों पर बैंगनी दाग छोड़ सकता है।"],["लीची","विटामिन C और पॉलीफ़िनॉल देती है, साथ में खूब पानी, गर्मियों का मीठा रसीला फल। इसमें प्राकृतिक शक्कर होती है, इसलिए मुट्ठी भर काफ़ी है। छिलका और बीज निकालकर खाएँ, बीज न खाएँ, और पकी हुई लीची सीमित मात्रा में, खाने के साथ खाएँ, खाली पेट बहुत ज़्यादा नहीं।"],["चीकू","बहुत मीठा फल जो प्राकृतिक शक्कर से ऊर्जा देता है, साथ में फ़ाइबर, पोटैशियम और विटामिन C। पका नरम चीकू मीठा होता है, जबकि कच्चा चिपचिपा और कसैला लगता है। कैलोरी ज़्यादा होने से वज़न बढ़ाने वालों के लिए अच्छा है।"]]],
["सब्ज़ियाँ",[["पालक","हरी पत्तेदार सब्ज़ी जिसमें ख़ून के लिए आयरन, कोशिकाओं की बढ़त के लिए फ़ोलेट, और ख़ून जमने व हड्डियों की सेहत में काम आने वाला विटामिन K होता है। हल्का पकाने से उसकी मात्रा घटती है, इसलिए पकी हुई एक कटोरी में कच्चे पत्तों के बराबर आयतन से ज़्यादा पोषक तत्व आते हैं।"],["ब्रोकली","ऐसी सब्ज़ी जिसमें पाचन में मदद करने वाला फ़ाइबर, विटामिन C और पौधों के वो तत्व होते हैं जो एंटीऑक्सीडेंट का काम करते हैं। उबालने की बजाय भाप में पकाने से ये पोषक तत्व पानी में बहने की बजाय सब्ज़ी में बचे रहते हैं।"],["गाजर","बीटा-कैरोटीन के लिए जानी जाती है, जिसे शरीर विटामिन A में बदल देता है, जो आँखों की सेहत के लिए ज़रूरी है। गाजर को थोड़े तेल के साथ हल्का पकाने से शरीर कच्ची गाजर से ज़्यादा ये पोषक तत्व सोख पाता है।"],["टमाटर","लाइकोपीन नाम का पौधों का तत्व देता है, जिसे एंटीऑक्सीडेंट असर से जोड़ा जाता है, साथ में विटामिन C। टमाटर को पकाने से, जैसे चटनी बनाकर, शरीर लाइकोपीन और ज़्यादा सोख पाता है।"],["खीरा","ज़्यादातर पानी होता है, इसलिए खाने में हल्का, कम कैलोरी वाला इज़ाफ़ा है, साथ में थोड़ा विटामिन K। ठंडा रखने से गर्मी में ये ताज़गी देने वाला विकल्प बन जाता है।"],["करेला","दक्षिण एशिया के खाने में पुराना हिस्सा, जिसमें फ़ाइबर और विटामिन C होता है। पकाने से पहले कटे हुए टुकड़ों पर नमक लगाकर धोने से इसकी कड़वाहट कम हो जाती है।"],["फूलगोभी","अनाज वाले साइड डिश का हल्का विकल्प, जिसमें फ़ाइबर और विटामिन C होता है। जिस भी मसाले में पकाई जाए, उसका स्वाद ले लेती है, इसीलिए इतनी ज़्यादा इस्तेमाल होती है।"],["प्याज़","ज़्यादातर नमकीन खाने की बुनियाद के तौर पर इस्तेमाल होता है, जिसमें पौधों के एंटीऑक्सीडेंट तत्व होते हैं। धीमी आँच पर धीरे पकाने से बिना चीनी डाले प्राकृतिक मिठास निकल आती है।"],["लहसुन","थोड़ी मात्रा में स्वाद के लिए इस्तेमाल होता है, जिसमें एलिसिन नाम का तत्व होता है जो कुचलने या काटने पर बनता है। कटे हुए लहसुन को पकाने से पहले कुछ मिनट रखने से ये तत्व और ज़्यादा बनता है।"],["आलू","ऊर्जा के लिए कार्बोहाइड्रेट, साथ में पोटैशियम, विटामिन C, और छिलका खाने पर फ़ाइबर। तलने की बजाय उबालना या बेक करना हल्का रहता है। उबालकर ठंडा किए आलू में रेज़िस्टेंट स्टार्च बनता है, जो एक तरह का कार्बोहाइड्रेट है और कुछ हद तक फ़ाइबर जैसा काम करता है।"],["शकरकंद","नारंगी रंग बीटा-कैरोटीन से आता है, साथ में फ़ाइबर, विटामिन C और पोटैशियम। तलने की बजाय उबालकर या भूनकर खाएँ। रंग जितना गहरा नारंगी, बीटा-कैरोटीन उतना ज़्यादा।"],["पत्तागोभी","विटामिन C और विटामिन K देती है, साथ में फ़ाइबर, और कैलोरी कम। सलाद में कच्ची खाने से विटामिन C ज़्यादा बचता है, जबकि हल्का पकाने से पचाना आसान होता है। गोभी परिवार की सब्ज़ियों से कुछ लोगों को गैस हो सकती है।"],["मटर","सब्ज़ी के हिसाब से प्रोटीन अच्छा देती है, साथ में फ़ाइबर, विटामिन K, फ़ोलेट और विटामिन C। जमी हुई मटर तोड़ने के तुरंत बाद जमाई जाती है, इसलिए पोषक तत्व अच्छे बचे रहते हैं। ये पुलाव, सब्ज़ी और सूप सभी में आसानी से चल जाती है।"],["भिंडी","फ़ाइबर, विटामिन C, विटामिन K और फ़ोलेट देती है। इसका चिपचिपा हिस्सा घुलनशील फ़ाइबर है। नींबू या टमाटर जैसी खटास के साथ या तेज़ आँच पर पकाने से चिपचिपापन कम होता है। छोटी और कोमल भिंडी चुनें।"],["कद्दू","बीटा-कैरोटीन, विटामिन C, पोटैशियम और फ़ाइबर देता है, कैलोरी कम। इसके बीज भी खाने लायक़ हैं, जिनमें प्रोटीन, मैग्नीशियम और ज़िंक होता है। नरम और पचाने में आसान, सूप और सब्ज़ी के लिए अच्छा।"],["चुकंदर","फ़ोलेट, पोटैशियम और बीटालेन नाम के पौधों के तत्व देता है जो इसे लाल रंग देते हैं; इसमें मौजूद नाइट्रेट को अध्ययनों में ब्लड प्रेशर को सहारा देने से जोड़ा गया है। ये पेशाब या मल को गुलाबी-लाल कर सकता है, जो नुक़सानदेह नहीं। छिलके समेत उबालें या भूनें।"],["मूली","कैलोरी कम, विटामिन C और फ़ाइबर, साथ में तीखा कुरकुरापन। कच्ची सलाद में या पराठे में भरकर खाई जाती है। इसके पत्ते भी खाने लायक़ हैं और उनमें विटामिन C और कैल्शियम होता है; उन्हें दूसरे साग की तरह पकाया जा सकता है।"],["लौकी","ज़्यादातर पानी, कैलोरी बहुत कम, फ़ाइबर, और पाचन पर हल्की, इसीलिए रोज़ के घर के खाने में आम है। इसका स्वाद हल्का है, इसलिए मसालों का स्वाद पकड़ लेती है। अगर लौकी कड़वी लगे तो उसे खाने की बजाय फेंक दें।"],["शिमला मिर्च","विटामिन C देती है, लाल शिमला मिर्च में हरी से भी ज़्यादा, साथ में विटामिन A और एंटीऑक्सीडेंट। कच्ची सलाद में या जल्दी पकाकर खाएँ। रंग से पकने की अवस्था पता चलती है।"],["बैंगन","फ़ाइबर, पोटैशियम और बैंगनी छिलके में नैसुनिन नाम का तत्व देता है जो एंटीऑक्सीडेंट का काम करता है। तलने पर तेल बहुत सोखता है, जबकि भूनने या ग्रिल करने से हल्का रहता है।"],["मेथी","आयरन, विटामिन K, विटामिन C और फ़ाइबर देती है। हल्की कड़वी होती है; पराठे और सब्ज़ी में इस्तेमाल होती है। सूखी कसूरी मेथी ज़्यादातर स्वाद के लिए डाली जाती है। कड़वाहट संतुलित करने के लिए इसे आलू या दही जैसी चीज़ों के साथ पकाएँ।"]]],
["फ़िट रहें",[["प्रोटीन","अंडा, दाल और मछली जैसी चीज़ें रिफ़ाइंड कार्बोहाइड्रेट से देर में पचती हैं, इसलिए खाना ज़्यादा देर तक पेट भरा रखता है। नाश्ते, दोपहर और रात के खाने में प्रोटीन बाँटकर खाना, एक ही बार में ज़्यादा खाने से, दिन भर ऊर्जा बनाए रखने में आम तौर पर बेहतर रहता है।"],["फ़ाइबर","सब्ज़ियों, फलों और साबुत अनाज में मिलने वाला फ़ाइबर पाचन को धीमा करता है, जिससे खानों के बीच भूख स्थिर रहती है और पाचन नियमित रहता है। फ़ाइबर धीरे-धीरे बढ़ाइए और पानी भी पर्याप्त पीजिए, ताकि एक साथ ज़्यादा लेने से पेट फूलने जैसी दिक़्क़त न हो।"],["पैदल चलना","सीधी और हल्की कसरत जो बिना किसी सामान के शुरू की जा सकती है। हफ़्ते के ज़्यादातर दिन लगभग 30 मिनट चलना दिल की सेहत और वज़न संभालने में मदद करता है और मूड भी बेहतर कर सकता है। एक लंबी सैर मुमकिन न हो तो इसे दो-तीन छोटी सैर में बाँट लीजिए।"]]],
["वज़न बढ़ाएँ",[["मेवे","छोटी मात्रा में ज़्यादा कैलोरी वाला खाना, इसलिए खानों के बीच एक मुट्ठी खाना बिना ज़्यादा खाए कैलोरी बढ़ाने का आसान तरीक़ा है। इनमें सेहतमंद वसा और प्रोटीन भी होता है, यानी जुड़ने वाली कैलोरी के साथ काम का पोषण मिलता है, सिर्फ़ चीनी नहीं।"],["फ़ुल-क्रीम दूध","इसमें दूध की प्राकृतिक चिकनाई बनी रहती है जो लो-फ़ैट या स्किम्ड दूध में निकाल दी जाती है, इसलिए वज़न बढ़ाने वालों के लिए ये ज़्यादा कैलोरी वाला विकल्प है। खाने के साथ एक गिलास पीना, या केले और मेवों के साथ शेक बनाना, खान-पान में बड़ा बदलाव किए बिना कैलोरी और प्रोटीन बढ़ाने का आसान तरीक़ा है।"],["वज़न की ट्रेनिंग","वज़न या अपने शरीर के भार वाली कसरतें शरीर को संकेत देती हैं कि अतिरिक्त कैलोरी का इस्तेमाल मांसपेशियाँ बनाने में करे, सारी की सारी चर्बी बनाकर जमा करने की बजाय। खाने में पर्याप्त प्रोटीन के साथ ये ज़्यादा असरदार रहती है, और हफ़्ते में दो-तीन सत्र से शुरुआत काफ़ी है।"]]]]},
ur:{name:"اردو",dir:"rtl",tag:"روزمرہ صحت کے لیے خوراک کی معلومات",
note:"صرف عمومی معلومات ہے، طبی مشورہ نہیں۔ اپنی صحت کے بارے میں ڈاکٹر یا ڈائٹیشن سے بات کریں۔",
s:[
["سی فوڈ",[["سالمن","اومیگا-3 چکنائی سے بھرپور مچھلی، جسے دل کی صحت اور بلڈ پریشر متوازن رکھنے سے جوڑا جاتا ہے۔ ایک بار کی خوراک میں پٹھوں کی مرمت کے لیے اچھا پروٹین اور وٹامن ڈی بھی ملتا ہے، جو کم دھوپ میں رہنے والے کئی لوگوں میں کم پایا جاتا ہے۔ تلنے کی بجائے گرِل یا بیک کر کے کھانے سے اومیگا-3 زیادہ محفوظ رہتا ہے۔"],["سارڈین","چھوٹی مچھلی ہے اور اکثر ہڈیوں سمیت کھائی جاتی ہے، اس لیے ایک ہی نوالے میں کیلشیم اور اومیگا-3 دونوں مل جاتے ہیں۔ یہ پروٹین اور وٹامن بی 12 کا سستا ذریعہ بھی ہے، اور بی 12 اعصاب کے کام اور سرخ خون کے خلیے بنانے کے لیے ضروری ہے۔"],["جھینگا","کم کیلوریز والا ہلکا پروٹین، جو زیادہ تر غذاؤں میں آسانی سے فٹ ہو جاتا ہے۔ اس میں آیوڈین ہوتا ہے جو تھائرائیڈ غدود کے درست کام کے لیے چاہیے، اور سیلینیم جو قوتِ مدافعت کو سہارا دیتا ہے۔"]]],
["دودھ",[["دودھ","ہڈیوں اور دانتوں کے لیے کیلشیم کا روزمرہ آسان ذریعہ، ساتھ پروٹین اور وٹامن بی 12۔ کئی برانڈ اس میں وٹامن ڈی بھی شامل کرتے ہیں جو کیلشیم جذب کرنے میں مدد دیتا ہے۔ ناشتے کے ساتھ ایک گلاس دن بھر کی کیلشیم کی ضرورت کا اچھا حصہ پورا کر دیتا ہے۔"],["دہی","دودھ کو جما کر بنتی ہے، اس لیے اس میں زندہ مفید بیکٹیریا ہوتے ہیں جو ہاضمے اور پیٹ کی صحت میں مدد دے سکتے ہیں۔ اس میں دودھ جتنا ہی کیلشیم اور پروٹین ہوتا ہے، اور جمنے کی وجہ سے کچھ لوگوں کے لیے سادہ دودھ سے ہضم کرنا آسان ہوتا ہے۔"],["پنیر","پنیر گاڑھا کیا ہوا دودھ ہے، اس لیے تھوڑی مقدار میں ہی کیلشیم، پروٹین اور وٹامن بی 12 مل جاتے ہیں۔ ساتھ ہی اس میں دودھ یا دہی سے زیادہ نمک اور سیچوریٹڈ چکنائی ہوتی ہے، اس لیے انگوٹھے جتنا ٹکڑا کافی ہے، بڑا سلائس نہیں۔"]]],
["پھل",[["کیلا","قدرتی شکر سے فوری توانائی دینے والا آسان پھل، ساتھ پوٹاشیم، جو پٹھوں اور دل کے درست کام میں مدد دیتا ہے اور خوراک میں سوڈیم کا اثر متوازن رکھتا ہے۔ کیلا جتنا پکا ہو، اتنا میٹھا اور ہضم کرنے میں آسان ہوتا ہے۔"],["مالٹا","وٹامن سی کے لیے مشہور ہے، جو قوتِ مدافعت کو سہارا دیتا ہے اور اسی کھانے میں کھائے گئے پودوں والے آئرن کو جذب کرنے میں مدد دیتا ہے۔ گودے میں ریشہ بھی ہوتا ہے، اسی لیے صرف جوس کی بجائے پورا پھل کھانا بہتر ہے۔"],["سیب","زیادہ تر چھلکے میں موجود ریشہ دیتا ہے، ساتھ پودوں کے وہ اجزا جو اینٹی آکسیڈنٹ کا کام کرتے ہیں۔ یہ آسانی سے ساتھ لے جایا جا سکتا ہے اور کئی دن خراب نہیں ہوتا، اس لیے ناشتے کے لیے رکھنا آسان پھل ہے۔"],["پپیتا","اس میں پیپین نامی اینزائم ہوتا ہے جو پروٹین ہضم کرنے میں مدد دے سکتا ہے، ساتھ وٹامن سی اور وٹامن اے۔ نرم، پکا ہوا پپیتا زیادہ تر پھلوں کی نسبت ہاضمے کے لیے ہلکا ہوتا ہے۔"],["امرود","وزن کے حساب سے مالٹے سے بھی زیادہ وٹامن سی دیتا ہے، ساتھ اس کے کھانے کے قابل بیجوں سے ریشہ۔ جنوبی ایشیا میں عام اور سستا ہے، اس لیے روزانہ کھانے کے لیے آسان پھل ہے۔"],["انار","پولی فینول نامی اینٹی آکسیڈنٹ پودوں کے اجزا کے لیے جانا جاتا ہے، ساتھ وٹامن سی اور بیجوں میں ریشہ۔ دانے ایسے ہی کھائے جا سکتے ہیں یا سلاد اور دہی کے اوپر ڈالے جا سکتے ہیں۔"],["تربوز","زیادہ تر پانی ہوتا ہے، اس لیے گرمی میں جسم میں پانی کی کمی نہ ہونے دینے میں کام آتا ہے، ساتھ وٹامن اے اور لائیکوپین نامی پودوں کا جزو جو اسے سرخ رنگ دیتا ہے۔"],["انگور","پولی فینول نامی پودوں کے اجزا والا فوری توانائی دینے والا پھل، جو گہرے رنگ کی اقسام کے چھلکے اور بیجوں میں زیادہ ہوتے ہیں۔ آسانی سے ساتھ لے جایا اور بغیر تیاری کے کھایا جا سکتا ہے۔"],["آم","وٹامن اے اور وٹامن سی سے بھرپور، جو آنکھوں کی صحت اور قوتِ مدافعت میں مدد دیتے ہیں۔ فطری طور پر میٹھا اور زیادہ کیلوریز والا ہونے سے وزن بڑھانے والوں کے لیے بھی پسندیدہ پھل ہے۔"],["انناس","اس میں برومیلین نامی اینزائم ہوتا ہے جو پروٹین ہضم کرنے میں مدد دے سکتا ہے، ساتھ وٹامن سی اور میگنیز۔ وٹامن سی قوتِ مدافعت کو سہارا دیتا ہے اور میگنیز ہڈیوں اور توانائی بننے کے عمل میں کام آتا ہے۔ یہ کافی کھٹا ہوتا ہے، اس لیے زیادہ مقدار میں کھانے پر کچھ لوگوں کے منہ یا پیٹ میں جلن ہو سکتی ہے۔"],["اسٹرابیری","کیلوریز کم ہوتی ہیں، پھر بھی وٹامن سی اور اینتھوسائنن نامی پودوں کے اجزا دیتی ہے جو اسے سرخ رنگ دیتے ہیں اور اینٹی آکسیڈنٹ کا کام کرتے ہیں۔ اس میں ریشہ اور فولیٹ بھی ہوتا ہے۔ جلدی خراب نہ ہوں، اس لیے انہیں کھانے سے ذرا پہلے دھوئیں، رکھنے سے پہلے نہیں۔"],["کیوی","وزن کے حساب سے مالٹے سے زیادہ وٹامن سی دیتی ہے، ساتھ ریشہ اور وٹامن کے۔ کچھ مطالعات میں اسے کچھ لوگوں کے لیے ہاضمہ باقاعدہ رکھنے سے جوڑا گیا ہے۔ دھو کر چھلکے سمیت کھا سکتے ہیں، جس سے ریشہ مزید ملتا ہے، یا چمچ سے گودا نکال کر کھائیں۔"],["ناشپاتی","چھلکے میں موجود ریشے کے ساتھ وٹامن سی اور پوٹاشیم دیتی ہے۔ رسیلی اور ہلکی ہوتی ہے، اس لیے ہلکا میٹھا ناشتہ چاہیے ہو تو اچھا انتخاب ہے۔ توڑنے کے بعد بھی پکتی ہے، اس لیے سخت ناشپاتی کو کچھ دن کمرے کے درجہ حرارت پر رکھا جا سکتا ہے۔"],["کھجور","قدرتی شکر کا گاڑھا ذریعہ جو فوری توانائی دیتا ہے، ساتھ ریشہ، پوٹاشیم اور میگنیشیم۔ اس میں کیلوریز زیادہ ہوتی ہیں، اس لیے چند دانے ہی کافی ہیں؛ روزہ کھولنے کے لیے اور وزن بڑھانے والوں کے لیے بھی پسندیدہ ہے۔ میوہ جات یا دودھ کے ساتھ کھانے سے یہ زیادہ متوازن ناشتہ بن جاتا ہے۔"],["انجیر","ریشہ، کیلشیم اور پوٹاشیم دیتا ہے۔ تازہ اور خشک دونوں طرح کھایا جاتا ہے؛ خشک انجیر میں شکر اور کیلوریز زیادہ گاڑھی ہوتی ہیں، اس لیے مقدار کا خیال رکھیں۔ ریشہ ہاضمہ باقاعدہ رکھنے میں مدد دے سکتا ہے، اور رات بھر بھگونے سے خشک انجیر نرم اور کھانے میں آسان ہو جاتے ہیں۔"],["لیموں","وٹامن سی اور سائٹرک ایسڈ دیتا ہے، اور پانی، سلاد اور کھانے میں ذائقہ لاتا ہے۔ پالک یا دال جیسی آئرن والی غذا پر نچوڑنے سے جسم کو پودوں والا آئرن بہتر جذب کرنے میں مدد مل سکتی ہے۔ یہ کھٹا ہوتا ہے، اس لیے لیموں کا پانی پینے کے بعد سادہ پانی سے کلی کرنا دانتوں کی تہہ بچانے میں مدد دیتا ہے۔"],["خربوزہ","زیادہ تر پانی ہوتا ہے، ساتھ وٹامن اے، وٹامن سی اور پوٹاشیم، اس لیے گرمی میں جسم کو نمی دیتا ہے۔ مٹھاس کے حساب سے کیلوریز کم ہوتی ہیں۔ کاٹنے سے پہلے چھلکا اچھی طرح دھوئیں، کیونکہ چھری باہر کے جراثیم اندر تک لے جا سکتی ہے۔"],["ناریل","ناریل کے پانی میں پانی اور پوٹاشیم ہوتا ہے، جو جسم میں پانی کی کمی پوری کرنے کا ایک قدرتی ذریعہ ہے؛ سفید گری میں ریشہ اور چکنائی ہوتی ہے، جس میں زیادہ تر سیچوریٹڈ ہے، اس لیے محدود مقدار میں کھائیں۔ ناریل کا پانی کھلنے کے بعد اسی دن پی لینا بہتر ہے۔"],["جامن","جنوبی ایشیا میں برسات کا موسمی پھل، جس کا گہرا بنفشی رنگ اینتھوسائنن سے آتا ہے، ساتھ وٹامن سی اور تھوڑا آئرن۔ یہ بہت میٹھا نہیں بلکہ ہلکا کسیلا کھٹا ہوتا ہے، اس لیے اکثر چٹکی بھر نمک کے ساتھ کھایا جاتا ہے۔ تازہ اور پکا ہوا کھائیں؛ یہ زبان اور کپڑوں پر بنفشی داغ چھوڑ سکتا ہے۔"],["لیچی","وٹامن سی اور پولی فینول دیتی ہے، ساتھ خوب پانی، گرمیوں کا میٹھا رسیلا پھل۔ اس میں قدرتی شکر ہوتی ہے، اس لیے مٹھی بھر کافی ہے۔ چھلکا اور بیج نکال کر کھائیں، بیج نہ کھائیں، اور پکی ہوئی لیچی محدود مقدار میں کھانے کے ساتھ کھائیں، خالی پیٹ بہت زیادہ نہیں۔"],["چیکو","بہت میٹھا پھل جو قدرتی شکر سے توانائی دیتا ہے، ساتھ ریشہ، پوٹاشیم اور وٹامن سی۔ پکا نرم چیکو میٹھا ہوتا ہے، جبکہ کچا چپچپا اور کسیلا لگتا ہے۔ کیلوریز زیادہ ہونے سے وزن بڑھانے والوں کے لیے اچھا ہے۔"]]],
["سبزیاں",[["پالک","ہری پتوں والی سبزی جس میں خون کے لیے آئرن، خلیوں کی بڑھوتری کے لیے فولیٹ، اور خون جمنے اور ہڈیوں کی صحت میں کام آنے والا وٹامن کے ہوتا ہے۔ ہلکا پکانے سے اس کا حجم کم ہو جاتا ہے، اس لیے پکی ہوئی ایک پیالی میں کچے پتوں کے برابر حجم سے زیادہ غذائی اجزا آتے ہیں۔"],["بروکلی","ایسی سبزی جس میں ہاضمے میں مدد دینے والا فائبر، وٹامن سی اور پودوں کے وہ اجزا ہوتے ہیں جو اینٹی آکسیڈنٹ کا کام کرتے ہیں۔ ابالنے کی بجائے بھاپ میں پکانے سے یہ غذائی اجزا پانی میں بہنے کی بجائے سبزی میں محفوظ رہتے ہیں۔"],["گاجر","بیٹا کیروٹین کے لیے جانی جاتی ہے، جسے جسم وٹامن اے میں بدل دیتا ہے، جو آنکھوں کی صحت کے لیے ضروری ہے۔ گاجر کو تھوڑے تیل کے ساتھ ہلکا پکانے سے جسم کچی گاجر سے زیادہ یہ غذائی جزو جذب کر پاتا ہے۔"],["ٹماٹر","لائیکوپین نامی پودوں کا جزو دیتا ہے، جسے اینٹی آکسیڈنٹ اثر سے جوڑا جاتا ہے، ساتھ وٹامن سی۔ ٹماٹر کو پکانے سے، جیسے چٹنی بنا کر، جسم لائیکوپین زیادہ جذب کر پاتا ہے۔"],["کھیرا","زیادہ تر پانی ہوتا ہے، اس لیے کھانے میں ہلکا، کم کیلوریز والا اضافہ ہے، ساتھ تھوڑا وٹامن کے۔ ٹھنڈا رکھنے سے گرمی میں یہ تازگی دینے والا انتخاب بن جاتا ہے۔"],["کریلا","جنوبی ایشیا کے کھانے کا پرانا حصہ، جس میں فائبر اور وٹامن سی ہوتا ہے۔ پکانے سے پہلے کٹے ہوئے ٹکڑوں پر نمک لگا کر دھونے سے اس کی کڑواہٹ کم ہو جاتی ہے۔"],["پھول گوبھی","اناج والے سائیڈ ڈش کا ہلکا متبادل، جس میں فائبر اور وٹامن سی ہوتا ہے۔ جس بھی مصالحے میں پکائی جائے، اس کا ذائقہ لے لیتی ہے، اسی لیے اتنی زیادہ استعمال ہوتی ہے۔"],["پیاز","زیادہ تر نمکین کھانے کی بنیاد کے طور پر استعمال ہوتا ہے، جس میں پودوں کے اینٹی آکسیڈنٹ اجزا ہوتے ہیں۔ دھیمی آنچ پر آہستہ پکانے سے بغیر چینی ڈالے فطری مٹھاس نکل آتی ہے۔"],["لہسن","تھوڑی مقدار میں ذائقے کے لیے استعمال ہوتا ہے، جس میں ایلیسن نامی جزو ہوتا ہے جو کچلنے یا کاٹنے پر بنتا ہے۔ کٹے ہوئے لہسن کو پکانے سے پہلے چند منٹ رکھنے سے یہ جزو زیادہ بنتا ہے۔"],["آلو","توانائی کے لیے کاربوہائیڈریٹ، ساتھ پوٹاشیم، وٹامن سی، اور چھلکا کھانے پر ریشہ۔ تلنے کی بجائے ابالنا یا بیک کرنا ہلکا رہتا ہے۔ ابال کر ٹھنڈے کیے آلو میں ریزسٹنٹ اسٹارچ بنتا ہے، جو ایک طرح کا کاربوہائیڈریٹ ہے اور کسی حد تک ریشے جیسا کام کرتا ہے۔"],["شکرقندی","نارنجی رنگ بیٹا کیروٹین سے آتا ہے، ساتھ ریشہ، وٹامن سی اور پوٹاشیم۔ تلنے کی بجائے ابال کر یا بھون کر کھائیں۔ رنگ جتنا گہرا نارنجی، بیٹا کیروٹین اتنا زیادہ۔"],["بند گوبھی","وٹامن سی اور وٹامن کے دیتی ہے، ساتھ ریشہ، اور کیلوریز کم۔ سلاد میں کچی کھانے سے وٹامن سی زیادہ بچتا ہے، جبکہ ہلکا پکانے سے ہضم کرنا آسان ہوتا ہے۔ گوبھی کے خاندان کی سبزیوں سے کچھ لوگوں کو گیس ہو سکتی ہے۔"],["مٹر","سبزی کے حساب سے پروٹین اچھا دیتے ہیں، ساتھ ریشہ، وٹامن کے، فولیٹ اور وٹامن سی۔ منجمد مٹر توڑنے کے فوراً بعد جمائے جاتے ہیں، اس لیے غذائی اجزا اچھے بچے رہتے ہیں۔ یہ پلاؤ، سبزی اور سوپ سب میں آسانی سے چل جاتے ہیں۔"],["بھنڈی","ریشہ، وٹامن سی، وٹامن کے اور فولیٹ دیتی ہے۔ اس کا چپچپا حصہ حل ہونے والا ریشہ ہے۔ لیموں یا ٹماٹر جیسی کھٹاس کے ساتھ یا تیز آنچ پر پکانے سے چپچپاہٹ کم ہوتی ہے۔ چھوٹی اور نرم بھنڈی چنیں۔"],["کدو","بیٹا کیروٹین، وٹامن سی، پوٹاشیم اور ریشہ دیتا ہے، کیلوریز کم۔ اس کے بیج بھی کھانے کے قابل ہیں، جن میں پروٹین، میگنیشیم اور زنک ہوتا ہے۔ نرم اور ہضم کرنے میں آسان، سوپ اور سبزی کے لیے اچھا۔"],["چقندر","فولیٹ، پوٹاشیم اور بیٹالین نامی پودوں کے اجزا دیتا ہے جو اسے سرخ رنگ دیتے ہیں؛ اس میں موجود نائٹریٹ کو مطالعات میں بلڈ پریشر کو سہارا دینے سے جوڑا گیا ہے۔ یہ پیشاب یا فضلے کو گلابی سرخ کر سکتا ہے، جو نقصان دہ نہیں۔ چھلکے سمیت ابالیں یا بھونیں۔"],["مولی","کیلوریز کم، وٹامن سی اور ریشہ، ساتھ تیز کرارا پن۔ کچی سلاد میں یا پراٹھے میں بھر کر کھائی جاتی ہے۔ اس کے پتے بھی کھانے کے قابل ہیں اور ان میں وٹامن سی اور کیلشیم ہوتا ہے؛ انہیں دوسرے ساگ کی طرح پکایا جا سکتا ہے۔"],["لوکی","زیادہ تر پانی، کیلوریز بہت کم، ریشہ، اور ہاضمے پر ہلکی، اسی لیے روزمرہ کے گھریلو کھانے میں عام ہے۔ اس کا ذائقہ ہلکا ہے، اس لیے مصالحوں کا ذائقہ پکڑ لیتی ہے۔ اگر لوکی کڑوی لگے تو اسے کھانے کی بجائے پھینک دیں۔"],["شملہ مرچ","وٹامن سی دیتی ہے، سرخ شملہ مرچ میں ہری سے بھی زیادہ، ساتھ وٹامن اے اور اینٹی آکسیڈنٹس۔ کچی سلاد میں یا جلدی پکا کر کھائیں۔ رنگ سے پکنے کی حالت کا پتا چلتا ہے۔"],["بینگن","ریشہ، پوٹاشیم اور بنفشی چھلکے میں ناسونین نامی جزو دیتا ہے جو اینٹی آکسیڈنٹ کا کام کرتا ہے۔ تلنے پر تیل بہت جذب کرتا ہے، جبکہ بھوننے یا گرِل کرنے سے ہلکا رہتا ہے۔"],["میتھی","آئرن، وٹامن کے، وٹامن سی اور ریشہ دیتی ہے۔ ہلکی کڑوی ہوتی ہے؛ پراٹھے اور سبزی میں استعمال ہوتی ہے۔ خشک کسوری میتھی زیادہ تر ذائقے کے لیے ڈالی جاتی ہے۔ کڑواہٹ متوازن کرنے کے لیے اسے آلو یا دہی جیسی چیزوں کے ساتھ پکائیں۔"]]],
["فٹ رہیں",[["پروٹین","انڈا، دال اور مچھلی جیسی چیزیں ریفائنڈ کاربوہائیڈریٹ سے دیر میں ہضم ہوتی ہیں، اس لیے کھانا زیادہ دیر تک پیٹ بھرا رکھتا ہے۔ ناشتے، دوپہر اور رات کے کھانے میں پروٹین بانٹ کر کھانا، ایک ہی بار میں زیادہ کھانے سے، دن بھر توانائی برقرار رکھنے میں عموماً بہتر رہتا ہے۔"],["ریشہ","سبزیوں، پھلوں اور سالم اناج میں ملنے والا ریشہ ہاضمے کو سست کرتا ہے، جس سے کھانوں کے درمیان بھوک مستحکم رہتی ہے اور ہاضمہ باقاعدہ رہتا ہے۔ ریشہ آہستہ آہستہ بڑھائیں اور پانی بھی کافی پئیں، تاکہ ایک ساتھ زیادہ لینے سے پیٹ پھولنے جیسی شکایت نہ ہو۔"],["پیدل چلنا","سیدھی اور ہلکی ورزش جو بغیر کسی سامان کے شروع کی جا سکتی ہے۔ ہفتے کے زیادہ تر دنوں میں تقریباً 30 منٹ چلنا دل کی صحت اور وزن سنبھالنے میں مدد دیتا ہے اور موڈ بھی بہتر کر سکتا ہے۔ ایک لمبی سیر ممکن نہ ہو تو اسے دو تین چھوٹی سیروں میں بانٹ لیں۔"]]],
["وزن بڑھائیں",[["میوہ جات","چھوٹی مقدار میں زیادہ کیلوریز والی غذا، اس لیے کھانوں کے درمیان ایک مٹھی کھانا بغیر زیادہ کھائے کیلوریز بڑھانے کا آسان طریقہ ہے۔ ان میں صحت مند چکنائی اور پروٹین بھی ہوتا ہے، یعنی جڑنے والی کیلوریز کے ساتھ کام کی غذائیت ملتی ہے، صرف چینی نہیں۔"],["فُل کریم دودھ","اس میں دودھ کی قدرتی چکنائی برقرار رہتی ہے جو لو فیٹ یا سکمڈ دودھ میں نکال دی جاتی ہے، اس لیے وزن بڑھانے والوں کے لیے یہ زیادہ کیلوریز والا انتخاب ہے۔ کھانے کے ساتھ ایک گلاس پینا، یا کیلے اور میوہ جات کے ساتھ شیک بنانا، خوراک میں بڑی تبدیلی کیے بغیر کیلوریز اور پروٹین بڑھانے کا آسان طریقہ ہے۔"],["وزن کی ٹریننگ","وزن یا اپنے جسم کے بوجھ والی ورزشیں جسم کو اشارہ دیتی ہیں کہ اضافی کیلوریز پٹھے بنانے میں استعمال کرے، سب کی سب چربی بنا کر جمع کرنے کی بجائے۔ خوراک میں کافی پروٹین کے ساتھ یہ زیادہ مؤثر رہتی ہیں، اور ہفتے میں دو تین سیشن سے آغاز کافی ہے۔"]]]]}
};
L.en.s[0][1].push(["Tuna","A lean, high-protein fish that also provides omega-3 fats, vitamin D and selenium. Fresh tuna can be grilled or seared, while canned tuna is a convenient, inexpensive option. Larger tuna can carry more mercury, so it is best eaten in moderation rather than every day, especially by pregnant women and young children."],["Mackerel","A strongly flavoured oily fish that is rich in omega-3 fats, vitamin B12 and vitamin D. It is usually inexpensive and widely available. Eat it fresh, since oily fish spoils quickly, and avoid king mackerel, which can be high in mercury."],["Rohu","A freshwater carp widely eaten across South Asia, giving good protein with relatively little fat, along with B vitamins and some phosphorus. It is usually cooked in curries or fried. Rohu has many fine bones, so eat it carefully, especially when feeding children."],["Pomfret","A mild, delicate fish that is easy to cook and popular for frying or grilling whole. It provides protein, omega-3 fats and vitamin B12 with a fairly light taste, which makes it a good starting point for people new to fish."],["Crab","Gives lean protein along with zinc, copper and vitamin B12, which are important for immunity and for making red blood cells. Crab meat is naturally low in fat. Shellfish allergy is common and can be serious, so anyone who has reacted to shellfish before should avoid it."],["Squid","A lean source of protein that also provides vitamin B12, copper and selenium. It cooks very quickly, either briefly over high heat or slowly for a long time; cooking it for a middle length of time makes it rubbery. Frying adds a lot of oil, so grilling or stir-frying keeps it lighter."],["Hilsa","A prized oily fish of South Asia, rich in omega-3 fats, protein and vitamin D, with a distinctive rich taste. It has many fine bones, so it is eaten slowly and carefully. Because it is a fatty fish, steaming or light curries keep it lighter than deep frying."],["Trout","A freshwater fish with a mild taste, giving omega-3 fats, protein, vitamin D and B vitamins. It is often sold whole and cooks well baked or pan-seared. Farmed trout is widely available and usually a milder-tasting alternative to salmon."]);
L.hi.s[0][1].push(["ट्यूना","कम चर्बी वाली, ज़्यादा प्रोटीन वाली मछली, जो ओमेगा-3 वसा, विटामिन D और सेलेनियम भी देती है। ताज़ा ट्यूना ग्रिल या सेंककर खाया जा सकता है, जबकि डिब्बाबंद ट्यूना आसान और सस्ता विकल्प है। बड़ी ट्यूना में पारा (मर्करी) ज़्यादा हो सकता है, इसलिए इसे रोज़ की बजाय सीमित मात्रा में खाना बेहतर है, ख़ासकर गर्भवती महिलाओं और छोटे बच्चों के लिए।"],["मैकेरल","तेज़ स्वाद वाली तैलीय मछली, जो ओमेगा-3 वसा, विटामिन B12 और विटामिन D से भरपूर है। आम तौर पर सस्ती और आसानी से मिलने वाली है। ताज़ी खाएँ, क्योंकि तैलीय मछली जल्दी ख़राब होती है, और किंग मैकेरल से बचें जिसमें पारा ज़्यादा हो सकता है।"],["रोहू","मीठे पानी की मछली जो दक्षिण एशिया में बहुत खाई जाती है, जिसमें अच्छा प्रोटीन और अपेक्षाकृत कम चर्बी होती है, साथ में B विटामिन और कुछ फ़ॉस्फ़ोरस। इसे अक्सर करी में या तलकर खाया जाता है। रोहू में बारीक काँटे बहुत होते हैं, इसलिए ख़ासकर बच्चों को खिलाते समय ध्यान से खाएँ।"],["पॉमफ़्रेट","हल्के और नाज़ुक स्वाद की मछली जो पकाने में आसान है और साबुत तलने या ग्रिल करने के लिए लोकप्रिय है। इसमें प्रोटीन, ओमेगा-3 वसा और विटामिन B12 होता है, और इसका स्वाद हल्का होता है, इसलिए मछली खाना शुरू करने वालों के लिए अच्छी शुरुआत है।"],["केकड़ा","कम चर्बी वाला प्रोटीन देता है, साथ में ज़िंक, कॉपर और विटामिन B12, जो रोग-प्रतिरोधक क्षमता और लाल रक्त कोशिकाएँ बनाने के लिए ज़रूरी हैं। केकड़े का मांस स्वाभाविक रूप से कम वसा वाला होता है। शेलफ़िश से एलर्जी आम है और गंभीर हो सकती है, इसलिए जिसे पहले शेलफ़िश से रिएक्शन हुआ हो वो इससे बचे।"],["स्क्विड","कम चर्बी वाला प्रोटीन का स्रोत जो विटामिन B12, कॉपर और सेलेनियम भी देता है। ये बहुत जल्दी पकता है, या तो तेज़ आँच पर थोड़ी देर या धीमी आँच पर बहुत देर तक; बीच की अवधि में पकाने से ये रबड़ जैसा हो जाता है। तलने में बहुत तेल लगता है, इसलिए ग्रिल या स्टर-फ़्राई करने से हल्का रहता है।"],["हिल्सा","दक्षिण एशिया की क़ीमती तैलीय मछली, जो ओमेगा-3 वसा, प्रोटीन और विटामिन D से भरपूर है और जिसका स्वाद ख़ास तरह से भरपूर होता है। इसमें बारीक काँटे बहुत होते हैं, इसलिए इसे धीरे और ध्यान से खाया जाता है। चर्बीदार मछली होने से भाप में पकाना या हल्की करी बनाना तलने से हल्का रहता है।"],["ट्राउट","मीठे पानी की हल्के स्वाद वाली मछली, जो ओमेगा-3 वसा, प्रोटीन, विटामिन D और B विटामिन देती है। अक्सर साबुत बिकती है और बेक करने या तवे पर सेंकने पर अच्छी बनती है। फ़ार्म में पली ट्राउट आसानी से मिलती है और सामन की तुलना में आम तौर पर हल्के स्वाद का विकल्प है।"]);
L.ur.s[0][1].push(["ٹونا","کم چکنائی والی، زیادہ پروٹین والی مچھلی، جو اومیگا-3 چکنائی، وٹامن ڈی اور سیلینیم بھی دیتی ہے۔ تازہ ٹونا گرِل یا سینک کر کھایا جا سکتا ہے، جبکہ ڈبہ بند ٹونا آسان اور سستا انتخاب ہے۔ بڑی ٹونا میں پارہ (مرکری) زیادہ ہو سکتا ہے، اس لیے اسے روزانہ کی بجائے محدود مقدار میں کھانا بہتر ہے، خاص طور پر حاملہ خواتین اور چھوٹے بچوں کے لیے۔"],["میکرل","تیز ذائقے والی تیل دار مچھلی، جو اومیگا-3 چکنائی، وٹامن بی 12 اور وٹامن ڈی سے بھرپور ہے۔ عموماً سستی اور آسانی سے ملنے والی ہے۔ تازہ کھائیں، کیونکہ تیل دار مچھلی جلدی خراب ہوتی ہے، اور کنگ میکرل سے بچیں جس میں پارہ زیادہ ہو سکتا ہے۔"],["روہو","میٹھے پانی کی مچھلی جو جنوبی ایشیا میں بہت کھائی جاتی ہے، جس میں اچھا پروٹین اور نسبتاً کم چکنائی ہوتی ہے، ساتھ بی وٹامنز اور کچھ فاسفورس۔ اسے اکثر سالن میں یا تل کر کھایا جاتا ہے۔ روہو میں باریک کانٹے بہت ہوتے ہیں، اس لیے خاص طور پر بچوں کو کھلاتے وقت احتیاط سے کھائیں۔"],["پومفریٹ","ہلکے اور نازک ذائقے کی مچھلی جو پکانے میں آسان ہے اور پوری تلنے یا گرِل کرنے کے لیے مقبول ہے۔ اس میں پروٹین، اومیگا-3 چکنائی اور وٹامن بی 12 ہوتا ہے، اور اس کا ذائقہ ہلکا ہوتا ہے، اس لیے مچھلی کھانا شروع کرنے والوں کے لیے اچھی شروعات ہے۔"],["کیکڑا","کم چکنائی والا پروٹین دیتا ہے، ساتھ زنک، کاپر اور وٹامن بی 12، جو قوتِ مدافعت اور سرخ خون کے خلیے بنانے کے لیے ضروری ہیں۔ کیکڑے کا گوشت قدرتی طور پر کم چکنائی والا ہوتا ہے۔ شیل فش سے الرجی عام ہے اور سنگین ہو سکتی ہے، اس لیے جسے پہلے شیل فش سے ردعمل ہوا ہو وہ اس سے بچے۔"],["اسکوئیڈ","کم چکنائی والا پروٹین کا ذریعہ جو وٹامن بی 12، کاپر اور سیلینیم بھی دیتا ہے۔ یہ بہت جلدی پکتا ہے، یا تو تیز آنچ پر تھوڑی دیر یا دھیمی آنچ پر بہت دیر تک؛ درمیانی مدت میں پکانے سے یہ ربڑ جیسا ہو جاتا ہے۔ تلنے میں بہت تیل لگتا ہے، اس لیے گرِل یا اسٹر فرائی کرنے سے ہلکا رہتا ہے۔"],["ہلسا","جنوبی ایشیا کی قیمتی تیل دار مچھلی، جو اومیگا-3 چکنائی، پروٹین اور وٹامن ڈی سے بھرپور ہے اور جس کا ذائقہ خاص طور پر بھرپور ہوتا ہے۔ اس میں باریک کانٹے بہت ہوتے ہیں، اس لیے اسے آہستہ اور احتیاط سے کھایا جاتا ہے۔ چکنائی والی مچھلی ہونے سے بھاپ میں پکانا یا ہلکا سالن بنانا تلنے سے ہلکا رہتا ہے۔"],["ٹراؤٹ","میٹھے پانی کی ہلکے ذائقے کی مچھلی، جو اومیگا-3 چکنائی، پروٹین، وٹامن ڈی اور بی وٹامنز دیتی ہے۔ اکثر پوری بکتی ہے اور بیک کرنے یا توے پر سینکنے سے اچھی بنتی ہے۔ فارم میں پلی ٹراؤٹ آسانی سے ملتی ہے اور سامن کے مقابلے میں عموماً ہلکے ذائقے کا متبادل ہے۔"]);
L.en.s[1][1].push(["Paneer","A fresh cheese made by curdling milk, giving protein and calcium and fitting naturally into vegetarian meals. Homemade or fresh paneer has less salt than many processed cheeses. Frying paneer adds a lot of fat, so grilling it or adding it to curries and salads keeps it lighter."],["Buttermilk (Chaas)","The tangy liquid left over from churning butter, or a thinned yogurt drink, often with salt and spices. It gives calcium and some protein with fewer calories than milk, and being fermented it carries friendly bacteria. It is a cooling, easy-to-digest drink in hot weather."],["Ghee","Clarified butter, made by cooking butter and removing the milk solids. It is a concentrated source of fat and calories and carries vitamins A and E. Because it is calorie-dense and high in saturated fat, a small amount is enough, and it is popular for cooking at high heat."],["Butter","Made by churning cream, butter is mostly fat and adds richness and flavour to food. It carries some vitamin A but little else, so it is best used in small amounts. Salted butter adds sodium, so unsalted butter gives more control over the taste of a dish."],["Skimmed milk","Milk with the fat removed, so it has fewer calories than whole milk while keeping most of its calcium and protein. It is a good choice for those who want to cut back on saturated fat. It tastes thinner, and vitamins A and D, which dissolve in fat, are often added back."],["Soy milk","A plant-based drink made from soybeans, giving protein and, when fortified, added calcium and vitamin B12. It is a useful alternative for people who avoid dairy or are lactose intolerant. Check that the label says fortified and unsweetened, since sweetened versions can have a lot of added sugar."]);
L.hi.s[1][1].push(["पनीर","दूध को फाड़कर बना ताज़ा चीज़, जो प्रोटीन और कैल्शियम देता है और शाकाहारी खाने में आसानी से फ़िट होता है। घर का बना या ताज़ा पनीर कई प्रोसेस्ड चीज़ों से कम नमकीन होता है। पनीर तलने से उसमें बहुत चर्बी जुड़ जाती है, इसलिए उसे ग्रिल करके या करी और सलाद में डालकर खाना हल्का रहता है।"],["छाछ","मक्खन बिलोने के बाद बचा खट्टा तरल, या पतला किया हुआ दही का पेय, जिसमें अक्सर नमक और मसाले डाले जाते हैं। इसमें दूध से कम कैलोरी में कैल्शियम और थोड़ा प्रोटीन मिलता है, और ख़मीर उठा होने से इसमें अच्छे बैक्टीरिया होते हैं। गर्मी में ये ठंडक देने वाला और आसानी से पचने वाला पेय है।"],["घी","साफ़ किया हुआ मक्खन, जो मक्खन को पकाकर और दूध के ठोस हिस्से हटाकर बनता है। ये चर्बी और कैलोरी का गाढ़ा स्रोत है और इसमें विटामिन A और E होता है। कैलोरी ज़्यादा और सैचुरेटेड फ़ैट ज़्यादा होने से थोड़ी मात्रा ही काफ़ी है, और तेज़ आँच पर पकाने के लिए लोकप्रिय है।"],["मक्खन","क्रीम को बिलोकर बना मक्खन ज़्यादातर चर्बी होता है और खाने में गाढ़ापन और स्वाद जोड़ता है। इसमें कुछ विटामिन A होता है पर बाक़ी पोषण कम है, इसलिए थोड़ी मात्रा में इस्तेमाल करना बेहतर है। नमकीन मक्खन में सोडियम जुड़ता है, इसलिए बिना नमक वाला मक्खन खाने के स्वाद पर ज़्यादा नियंत्रण देता है।"],["स्किम्ड दूध","चर्बी निकाला हुआ दूध, इसलिए फ़ुल-क्रीम दूध से कैलोरी कम होती है और कैल्शियम और प्रोटीन ज़्यादातर बचे रहते हैं। जो सैचुरेटेड फ़ैट कम करना चाहते हैं उनके लिए अच्छा विकल्प है। इसका स्वाद पतला लगता है, और चर्बी में घुलने वाले विटामिन A और D अक्सर वापस मिलाए जाते हैं।"],["सोया दूध","सोयाबीन से बना पौधों वाला पेय, जो प्रोटीन देता है और फ़ोर्टिफ़ाइड होने पर कैल्शियम और विटामिन B12 भी। जो लोग डेयरी नहीं खाते या जिन्हें लैक्टोज़ से दिक़्क़त है उनके लिए ये काम का विकल्प है। लेबल देखें कि फ़ोर्टिफ़ाइड और बिना मीठे वाला है, क्योंकि मीठे वर्ज़न में बहुत शक्कर हो सकती है।"]);
L.ur.s[1][1].push(["دیسی پنیر","دودھ کو پھاڑ کر بنا تازہ پنیر، جو پروٹین اور کیلشیم دیتا ہے اور سبزی خور کھانے میں آسانی سے فٹ ہو جاتا ہے۔ گھر کا بنا یا تازہ پنیر کئی پراسیسڈ پنیروں سے کم نمکین ہوتا ہے۔ پنیر تلنے سے اس میں بہت چکنائی جڑ جاتی ہے، اس لیے اسے گرِل کر کے یا سالن اور سلاد میں ڈال کر کھانا ہلکا رہتا ہے۔"],["چھاچھ","مکھن بلونے کے بعد بچا کھٹا مائع، یا پتلا کیا ہوا دہی کا مشروب، جس میں اکثر نمک اور مصالحے ڈالے جاتے ہیں۔ اس میں دودھ سے کم کیلوریز میں کیلشیم اور تھوڑا پروٹین ملتا ہے، اور خمیر اٹھا ہونے سے اس میں مفید بیکٹیریا ہوتے ہیں۔ گرمی میں یہ ٹھنڈک دینے والا اور آسانی سے ہضم ہونے والا مشروب ہے۔"],["گھی","صاف کیا ہوا مکھن، جو مکھن کو پکا کر اور دودھ کے ٹھوس حصے ہٹا کر بنتا ہے۔ یہ چکنائی اور کیلوریز کا گاڑھا ذریعہ ہے اور اس میں وٹامن اے اور ای ہوتا ہے۔ کیلوریز زیادہ اور سیچوریٹڈ چکنائی زیادہ ہونے سے تھوڑی مقدار ہی کافی ہے، اور تیز آنچ پر پکانے کے لیے مقبول ہے۔"],["مکھن","کریم کو بلو کر بنا مکھن زیادہ تر چکنائی ہوتا ہے اور کھانے میں گاڑھا پن اور ذائقہ جوڑتا ہے۔ اس میں کچھ وٹامن اے ہوتا ہے مگر باقی غذائیت کم ہے، اس لیے تھوڑی مقدار میں استعمال کرنا بہتر ہے۔ نمکین مکھن میں سوڈیم جڑتا ہے، اس لیے بغیر نمک والا مکھن کھانے کے ذائقے پر زیادہ کنٹرول دیتا ہے۔"],["چکنائی نکالا دودھ","چکنائی نکالا ہوا دودھ، اس لیے فُل کریم دودھ سے کیلوریز کم ہوتی ہیں اور کیلشیم اور پروٹین زیادہ تر بچے رہتے ہیں۔ جو سیچوریٹڈ چکنائی کم کرنا چاہتے ہیں ان کے لیے اچھا انتخاب ہے۔ اس کا ذائقہ پتلا لگتا ہے، اور چکنائی میں گھلنے والے وٹامن اے اور ڈی اکثر واپس ملائے جاتے ہیں۔"],["سویا دودھ","سویابین سے بنا پودوں والا مشروب، جو پروٹین دیتا ہے اور فورٹیفائیڈ ہونے پر کیلشیم اور وٹامن بی 12 بھی۔ جو لوگ ڈیری نہیں کھاتے یا جنہیں لیکٹوز سے مسئلہ ہے ان کے لیے یہ کام کا متبادل ہے۔ لیبل دیکھیں کہ فورٹیفائیڈ اور بغیر میٹھے والا ہے، کیونکہ میٹھے ورژن میں بہت چینی ہو سکتی ہے۔"]);
L.en.s[4][1].push(["Water","Water makes up most of the body and is needed for digestion, circulation and keeping body temperature steady. Drinking enough through the day, more in hot weather or when exercising, helps avoid tiredness and headaches that come from dehydration. Pale yellow urine is a simple sign you are drinking enough."],["Sleep","Regular, sufficient sleep supports recovery after exercise, mood and appetite control. Poor sleep is linked with feeling hungrier and craving sugary food the next day. Going to bed and waking at similar times each day, and keeping screens away before bed, can help."],["Eggs","A compact source of protein that also provides vitamin B12, vitamin D, choline and several minerals. Boiled or poached eggs add no extra oil. Most healthy people can include eggs in a balanced diet, but people with specific health conditions should follow their doctor's advice."],["Oats","A whole grain that provides beta-glucan, a type of soluble fibre linked with healthy cholesterol levels, along with protein and slow-release carbohydrates. A bowl cooked with milk or water keeps many people full through the morning. Plain oats are better than flavoured packets, which often have added sugar."],["Lentils (Dal)","Dal gives plant protein, fibre, iron, folate and potassium at a low cost. Eating dal with rice or roti gives a more complete mix of amino acids than either one alone. Adding lemon juice at the end may help the body absorb the iron."],["Yoga","Combines gentle stretching, strength and controlled breathing, and can improve flexibility, balance and posture. Many people also find it helps them relax and manage stress. It can be started with a few simple poses at home, and moving slowly rather than forcing a stretch helps avoid injury."],["Cycling","A low-impact exercise that works the legs and heart without putting heavy stress on the joints. Cycling regularly, even for short trips instead of using a vehicle, adds up to useful activity over the week. Wearing a helmet and using lights in low light keeps it safe."]);
L.hi.s[4][1].push(["पानी","शरीर का ज़्यादातर हिस्सा पानी है और ये पाचन, ख़ून के बहाव और शरीर का तापमान स्थिर रखने के लिए ज़रूरी है। दिन भर पर्याप्त पीना, गर्मी में या कसरत के समय और ज़्यादा, पानी की कमी से होने वाली थकान और सिरदर्द से बचाता है। हल्का पीला पेशाब इस बात का आसान संकेत है कि आप ठीक मात्रा में पी रहे हैं।"],["नींद","नियमित और पर्याप्त नींद कसरत के बाद रिकवरी, मूड और भूख पर क़ाबू रखने में मदद करती है। कम नींद को अगले दिन ज़्यादा भूख और मीठा खाने की तलब से जोड़ा गया है। हर दिन लगभग एक ही समय पर सोना-जागना और सोने से पहले स्क्रीन से दूर रहना मदद कर सकता है।"],["अंडा","प्रोटीन का सघन स्रोत जो विटामिन B12, विटामिन D, कोलीन और कई खनिज भी देता है। उबले या पोच किए अंडे में अलग से तेल नहीं जुड़ता। ज़्यादातर सेहतमंद लोग संतुलित आहार में अंडे शामिल कर सकते हैं, पर किसी ख़ास स्वास्थ्य स्थिति वाले लोग अपने डॉक्टर की सलाह मानें।"],["ओट्स","साबुत अनाज जो बीटा-ग्लूकन देता है, एक तरह का घुलनशील फ़ाइबर जिसे सेहतमंद कोलेस्ट्रॉल स्तर से जोड़ा गया है, साथ में प्रोटीन और धीरे पचने वाला कार्बोहाइड्रेट। दूध या पानी में पकाया एक कटोरा कई लोगों का पेट सुबह भर भरा रखता है। सादा ओट्स फ़्लेवर वाले पैकेट से बेहतर है, जिनमें अक्सर शक्कर मिली होती है।"],["दाल","दाल कम क़ीमत में पौधों का प्रोटीन, फ़ाइबर, आयरन, फ़ोलेट और पोटैशियम देती है। दाल को चावल या रोटी के साथ खाने से किसी एक अकेले की तुलना में अमीनो एसिड का ज़्यादा पूरा मेल मिलता है। आख़िर में नींबू का रस डालने से शरीर को आयरन सोखने में मदद मिल सकती है।"],["योग","हल्की स्ट्रेचिंग, ताक़त और नियंत्रित साँस को जोड़ता है, और लचीलापन, संतुलन और बैठने-चलने का ढंग सुधार सकता है। कई लोगों को ये आराम करने और तनाव संभालने में भी मदद करता है। इसे घर पर कुछ आसान आसनों से शुरू किया जा सकता है, और ज़बरदस्ती खिंचाव की बजाय धीरे-धीरे करने से चोट से बचाव होता है।"],["साइकिल चलाना","कम झटके वाली कसरत जो जोड़ों पर भारी दबाव डाले बिना पैरों और दिल से काम लेती है। नियमित साइकिल चलाना, छोटे सफ़र में भी गाड़ी की जगह, हफ़्ते भर में काफ़ी काम की गतिविधि बन जाता है। हेलमेट पहनना और कम रोशनी में लाइट लगाना इसे सुरक्षित रखता है।"]);
L.ur.s[4][1].push(["پانی","جسم کا زیادہ تر حصہ پانی ہے اور یہ ہاضمے، خون کے بہاؤ اور جسم کا درجہ حرارت مستحکم رکھنے کے لیے ضروری ہے۔ دن بھر کافی پینا، گرمی میں یا ورزش کے وقت اور زیادہ، پانی کی کمی سے ہونے والی تھکن اور سر درد سے بچاتا ہے۔ ہلکا زرد پیشاب اس بات کی آسان علامت ہے کہ آپ مناسب مقدار میں پی رہے ہیں۔"],["نیند","باقاعدہ اور کافی نیند ورزش کے بعد بحالی، موڈ اور بھوک پر قابو رکھنے میں مدد دیتی ہے۔ کم نیند کو اگلے دن زیادہ بھوک اور میٹھا کھانے کی طلب سے جوڑا گیا ہے۔ ہر روز تقریباً ایک ہی وقت پر سونا جاگنا اور سونے سے پہلے اسکرین سے دور رہنا مدد کر سکتا ہے۔"],["انڈا","پروٹین کا گھنا ذریعہ جو وٹامن بی 12، وٹامن ڈی، کولین اور کئی معدنیات بھی دیتا ہے۔ ابلے یا پوچ کیے انڈے میں الگ سے تیل نہیں جڑتا۔ زیادہ تر صحت مند لوگ متوازن غذا میں انڈے شامل کر سکتے ہیں، مگر کسی خاص طبی کیفیت والے لوگ اپنے ڈاکٹر کی ہدایت پر عمل کریں۔"],["اوٹس","سالم اناج جو بیٹا گلوکن دیتا ہے، ایک طرح کا حل ہونے والا ریشہ جسے صحت مند کولیسٹرول کی سطح سے جوڑا گیا ہے، ساتھ پروٹین اور آہستہ ہضم ہونے والا کاربوہائیڈریٹ۔ دودھ یا پانی میں پکایا ایک پیالہ کئی لوگوں کا پیٹ صبح بھر بھرا رکھتا ہے۔ سادہ اوٹس فلیور والے پیکٹوں سے بہتر ہے، جن میں اکثر چینی ملی ہوتی ہے۔"],["دال","دال کم قیمت میں پودوں کا پروٹین، ریشہ، آئرن، فولیٹ اور پوٹاشیم دیتی ہے۔ دال کو چاول یا روٹی کے ساتھ کھانے سے کسی ایک اکیلے کے مقابلے میں امائنو ایسڈ کا زیادہ مکمل میل ملتا ہے۔ آخر میں لیموں کا رس ڈالنے سے جسم کو آئرن جذب کرنے میں مدد مل سکتی ہے۔"],["یوگا","ہلکی اسٹریچنگ، طاقت اور کنٹرول شدہ سانس کو جوڑتا ہے، اور لچک، توازن اور بیٹھنے چلنے کا انداز بہتر کر سکتا ہے۔ کئی لوگوں کو یہ آرام کرنے اور تناؤ سنبھالنے میں بھی مدد دیتا ہے۔ اسے گھر پر چند آسان آسنوں سے شروع کیا جا سکتا ہے، اور زبردستی کھنچاؤ کی بجائے آہستہ آہستہ کرنے سے چوٹ سے بچاؤ ہوتا ہے۔"],["سائیکل چلانا","کم جھٹکے والی ورزش جو جوڑوں پر بھاری دباؤ ڈالے بغیر ٹانگوں اور دل سے کام لیتی ہے۔ باقاعدہ سائیکل چلانا، چھوٹے سفر میں بھی گاڑی کی جگہ، ہفتے بھر میں کافی کام کی سرگرمی بن جاتا ہے۔ ہیلمٹ پہننا اور کم روشنی میں لائٹ لگانا اسے محفوظ رکھتا ہے۔"]);
L.en.s[5][1].push(["Peanut butter","Gives plenty of calories, protein and healthy fats in a small spoonful, which makes it an easy way to add calories without eating much more volume. Spread it on bread, add it to a banana or blend it into a milkshake. Choose a version with just peanuts and a little salt rather than one with lots of added sugar."],["Rice","A filling, easy-to-digest source of carbohydrates, which supply the energy the body needs to put on weight. Adding ghee, dal, vegetables or an egg turns a plain plate of rice into a more calorie-rich, balanced meal. Having an extra serving at a meal is a simple way to raise calories."],["Avocado","A fruit rich in healthy unsaturated fats, which makes it calorie-dense, along with fibre, potassium and vitamin K. Adding slices to sandwiches or salads, or blending it into a smoothie, raises calories in a nutritious way. It ripens at room temperature and is ready when it gives slightly to a gentle press."],["Chicken","A lean, high-quality protein that supports building and repairing muscle, along with B vitamins and phosphorus. Cooking it with the skin on or in a little oil adds calories, which can suit those trying to gain weight. Cook it thoroughly until no pink remains."],["Olive oil","A source of healthy monounsaturated fat, and with about the same calories per spoonful as any oil, it is an easy way to raise the calories of a meal. Drizzling a little over rice, salads, vegetables or bread adds energy and flavour. Use it in modest amounts, since all oils are calorie-dense."],["Milkshake & smoothie","Blending milk with banana, oats, nuts or peanut butter makes a drink that packs in many calories and protein but is easy to finish, which helps people who feel full quickly. Drinking one between meals, not just with them, raises the day's total. Make it at home to control the amount of added sugar."],["Regular meals","Eating three meals plus two or three snacks, rather than one or two big meals, makes it easier to take in more calories without feeling uncomfortably full. Keeping snacks like nuts, dates, bananas or boiled eggs handy helps you eat on time. Pairing this with strength training helps the extra calories go toward muscle."]);
L.hi.s[5][1].push(["पीनट बटर","छोटे चम्मच में ही बहुत कैलोरी, प्रोटीन और सेहतमंद वसा देता है, इसलिए ज़्यादा मात्रा खाए बिना कैलोरी बढ़ाने का आसान तरीक़ा है। इसे ब्रेड पर लगाएँ, केले के साथ खाएँ या मिल्कशेक में मिलाएँ। ऐसा वर्ज़न चुनें जिसमें सिर्फ़ मूँगफली और थोड़ा नमक हो, बहुत शक्कर वाला नहीं।"],["चावल","पेट भरने वाला, आसानी से पचने वाला कार्बोहाइड्रेट का स्रोत, जो वज़न बढ़ाने के लिए ज़रूरी ऊर्जा देता है। घी, दाल, सब्ज़ी या अंडा मिलाने से सादे चावल की थाली ज़्यादा कैलोरी वाला संतुलित खाना बन जाती है। एक खाने में थोड़ा और परोसना कैलोरी बढ़ाने का आसान तरीक़ा है।"],["एवोकाडो","सेहतमंद असंतृप्त वसा से भरपूर फल, जिससे इसमें कैलोरी ज़्यादा होती है, साथ में फ़ाइबर, पोटैशियम और विटामिन K। सैंडविच या सलाद में स्लाइस डालना, या स्मूदी में मिलाना, पौष्टिक तरीक़े से कैलोरी बढ़ाता है। ये कमरे के तापमान पर पकता है और हल्का दबाने पर थोड़ा दबे तो तैयार है।"],["चिकन","कम चर्बी वाला उच्च-गुणवत्ता का प्रोटीन जो मांसपेशियाँ बनाने और मरम्मत में मदद करता है, साथ में B विटामिन और फ़ॉस्फ़ोरस। छिलके समेत या थोड़े तेल में पकाने से कैलोरी बढ़ती है, जो वज़न बढ़ाने वालों के लिए ठीक हो सकता है। इसे अच्छी तरह पकाएँ जब तक गुलाबी हिस्सा न बचे।"],["ज़ैतून का तेल","सेहतमंद मोनोअनसैचुरेटेड वसा का स्रोत, और हर चम्मच में किसी भी तेल जितनी कैलोरी के साथ, खाने की कैलोरी बढ़ाने का आसान तरीक़ा है। चावल, सलाद, सब्ज़ियों या ब्रेड पर थोड़ा डालने से ऊर्जा और स्वाद दोनों बढ़ते हैं। सीमित मात्रा में इस्तेमाल करें, क्योंकि सभी तेलों में कैलोरी ज़्यादा होती है।"],["मिल्कशेक और स्मूदी","दूध को केले, ओट्स, मेवों या पीनट बटर के साथ ब्लेंड करने से ऐसा पेय बनता है जिसमें कैलोरी और प्रोटीन ज़्यादा होते हैं पर पीना आसान होता है, जो उन लोगों के काम आता है जिनका पेट जल्दी भर जाता है। खाने के बीच में पीना, सिर्फ़ खाने के साथ नहीं, दिन भर की कुल कैलोरी बढ़ाता है। चीनी की मात्रा पर क़ाबू रखने के लिए घर पर बनाएँ।"],["नियमित खाना","एक-दो बड़े खानों की बजाय तीन खाने और दो-तीन छोटे नाश्ते खाने से बिना बेचैनी वाले भारीपन के ज़्यादा कैलोरी लेना आसान होता है। मेवे, खजूर, केले या उबले अंडे जैसे नाश्ते पास रखने से समय पर खाने में मदद मिलती है। इसे वज़न की ट्रेनिंग के साथ जोड़ने से अतिरिक्त कैलोरी मांसपेशियों की ओर जाने में मदद मिलती है।"]);

const EMO=["🐟","🐟","🦐","🐟","🐟","🐟","🐠","🦀","🦑","🐟","🐟","🥛","🥣","🧀","🧀","🥛","🧈","🧈","🥛","🥛","🍌","🍊","🍎","🍈","🍐","🍎","🍉","🍇","🥭","🍍","🍓","🥝","🍐","🌴","🌿","🍋","🍈","🥥","🫐","🍒","🍑","🥬","🥦","🥕","🍅","🥒","🥒","🥦","🧅","🧄","🥔","🍠","🥬","🌱","🌿","🎃","🟣","🌱","🥒","🫑","🍆","🌿","🥚","🥦","🚶","💧","😴","🥚","🥣","🍲","🧘","🚴","🥜","🥛","🏋️","🥜","🍚","🥑","🍗","🌿","🥤","🍽️"];
let lang="en",sec=0,itm=0;
const $=id=>document.getElementById(id);
function render(){
 const d=L[lang];
 document.documentElement.lang=lang;document.documentElement.dir=d.dir;
 $("tag").textContent=d.tag;
 $("lang").innerHTML=Object.keys(L).map(k=>`<button data-l="${k}" aria-pressed="${k===lang}">${L[k].name}</button>`).join("");
 $("nav").innerHTML=d.s.map((s,i)=>`<button data-s="${i}" ${i===sec?'aria-current="true"':''}>${IMG['sec'+i]?`<img src="${IMG['sec'+i]}" alt="">`:''}<span>${s[0]}</span></button>`).join("");
 const s=d.s[sec];
 const base=d.s.slice(0,sec).reduce((n,t)=>n+t[1].length,0);
 if(itm>=s[1].length)itm=0;
 const card=(x,j)=>{const k=base+j;return `<button class="card" data-i="${j}" aria-pressed="${j===itm}"><span class="cpic" aria-hidden="true">${EMO[k]}<img src="${IMG[KEY[k]]}" alt=""></span><span class="n">${x[0]}</span></button>`};
 const k=base+itm,x=s[1][itm];
 $("main").innerHTML=`<h2>${s[0]}</h2><div class="grid">${s[1].map(card).join("")}</div><div class="detail"><img src="${IMG[KEY[k]]}" alt="${x[0]}"><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div><p class="note">${d.note}</p>`;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.l){lang=b.dataset.l;render();$("lang").querySelector('[aria-pressed="true"]').focus();}
 else if(b.dataset.i!==undefined){itm=+b.dataset.i;render();$("main").querySelector('[aria-pressed="true"]').focus();}
 else if(b.dataset.s){sec=+b.dataset.s;itm=0;render();$("nav").querySelector('[aria-current="true"]').focus();$("main").scrollTop=0;}
});
render();
</script>
